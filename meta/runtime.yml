---
requires_ansible: ">=2.20.0"
# Every module under plugins/modules/ must be listed (checked by tests/unit/test_runtime_groups.py).
# Usable as: module_defaults: {group/fjacquet.ppdm.ppdm: {hostname: ...}}
action_groups:
  ppdm:
    - api
    - credential_info
    - inventory_source_info
    - protection_policy_info
    - storage_system_info
    - certificate_info
    - credential
    - inventory_source
    - storage_system
    - eula
    - protection_policy
    - certificate
