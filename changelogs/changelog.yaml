ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: First pre-release of the unofficial fjacquet.ppdm collection
        for Dell PowerProtect Data Manager 20.3.0. It provides ten modules (a generic
        ``api`` module, info modules, and ensure-style modules), a ``bootstrap`` role
        and 58 playbooks grouped by use case. The ``api`` module accepts a list as
        well as a dictionary as request body, and the modules return the raw API response
        bodies (secrets masked), not reshaped data.
    fragments:
    - 0.1.0-release-summary.yml
    modules:
    - description: Call any PowerProtect Data Manager REST endpoint
      name: api
      namespace: ''
    - description: Trust or remove a host certificate on PowerProtect Data Manager
      name: certificate
      namespace: ''
    - description: Get certificates from PowerProtect Data Manager
      name: certificate_info
      namespace: ''
    - description: Manage credentials on PowerProtect Data Manager
      name: credential
      namespace: ''
    - description: Get credentials from PowerProtect Data Manager
      name: credential_info
      namespace: ''
    - description: Accept an end user license agreement on PowerProtect Data Manager
      name: eula
      namespace: ''
    - description: Manage inventory sources on PowerProtect Data Manager
      name: inventory_source
      namespace: ''
    - description: Get inventory sources from PowerProtect Data Manager
      name: inventory_source_info
      namespace: ''
    - description: Update a storage system on PowerProtect Data Manager
      name: storage_system
      namespace: ''
    - description: Get storage systems from PowerProtect Data Manager
      name: storage_system_info
      namespace: ''
    release_date: '2026-11-15'
  0.2.0:
    changes:
      breaking_changes:
      - protection.add_file_system_policy and protection.add_mssql_policy playbooks
        - now update an existing policy when it differs (PATCH, the whole objectives
        list is replaced) instead of leaving it unchanged.
      - protection.assign_assets_to_policy playbook - now requires ``assign_confirm=true``.
      - protection.run_policy playbook - now requires ``policy_run_confirm=true``
        and a non-empty ``asset_filter``, and the ``backup_level`` variable is removed
        (every objective of the policy runs).
      release_summary: Adds the protection modules ``protection_policy``, ``protection_policy_info``,
        ``protection_policy_assets``, ``protection_policy_run``, ``discovery``, ``protection_rule``,
        ``protection_rule_info`` and ``protection_rule_run``, and five protection
        playbooks (63 in total). The rule modules use the v2 rule API, which PPDM
        deprecated in 20.2 and removes in 20.6.
    fragments:
    - lot2-modules.yml
    modules:
    - description: Start a discovery on PowerProtect Data Manager
      name: discovery
      namespace: ''
    - description: Manage protection policies on PowerProtect Data Manager
      name: protection_policy
      namespace: ''
    - description: Assign or unassign assets to a protection policy on PowerProtect
        Data Manager
      name: protection_policy_assets
      namespace: ''
    - description: Get protection policies from PowerProtect Data Manager
      name: protection_policy_info
      namespace: ''
    - description: Run a protection policy now on PowerProtect Data Manager
      name: protection_policy_run
      namespace: ''
    - description: Manage protection rules on PowerProtect Data Manager
      name: protection_rule
      namespace: ''
    - description: Get protection rules from PowerProtect Data Manager
      name: protection_rule_info
      namespace: ''
    - description: Run protection rules or preview their conflicts on PowerProtect
        Data Manager
      name: protection_rule_run
      namespace: ''
    release_date: '2026-11-15'
