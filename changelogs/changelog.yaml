ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: First pre-release of the unofficial fjacquet.ppdm collection
        for Dell PowerProtect Data Manager 20.3.0. It provides ten modules (a generic
        ``api`` module, info modules, and ensure-style modules), a ``bootstrap`` role
        and 58 playbooks grouped by use case. The ``api`` module accepts a list as
        well as a dictionary as request body, and the modules return the raw API response
        bodies (secrets masked), not reshaped data.
    fragments:
    - 0.1.0-release-summary.yml
    modules:
    - description: Call any PowerProtect Data Manager REST endpoint
      name: api
      namespace: ''
    - description: Trust or remove a host certificate on PowerProtect Data Manager
      name: certificate
      namespace: ''
    - description: Get certificates from PowerProtect Data Manager
      name: certificate_info
      namespace: ''
    - description: Manage credentials on PowerProtect Data Manager
      name: credential
      namespace: ''
    - description: Get credentials from PowerProtect Data Manager
      name: credential_info
      namespace: ''
    - description: Accept an end user license agreement on PowerProtect Data Manager
      name: eula
      namespace: ''
    - description: Manage inventory sources on PowerProtect Data Manager
      name: inventory_source
      namespace: ''
    - description: Get inventory sources from PowerProtect Data Manager
      name: inventory_source_info
      namespace: ''
    - description: Update a storage system on PowerProtect Data Manager
      name: storage_system
      namespace: ''
    - description: Get storage systems from PowerProtect Data Manager
      name: storage_system_info
      namespace: ''
    release_date: '2026-11-15'
  0.2.0:
    changes:
      breaking_changes:
      - protection.add_file_system_policy and protection.add_mssql_policy playbooks
        - now update an existing policy when it differs (PATCH, the whole objectives
        list is replaced) instead of leaving it unchanged.
      - protection.assign_assets_to_policy playbook - now requires ``assign_confirm=true``.
      - protection.run_policy playbook - now requires ``policy_run_confirm=true``
        and a non-empty ``asset_filter``, and the ``backup_level`` variable is removed
        (every objective of the policy runs).
      release_summary: Adds the protection modules ``protection_policy``, ``protection_policy_info``,
        ``protection_policy_assets``, ``protection_policy_run``, ``discovery``, ``protection_rule``,
        ``protection_rule_info`` and ``protection_rule_run``, and five protection
        playbooks (63 in total). The rule modules use the v2 rule API, which PPDM
        deprecated in 20.2 and removes in 20.6.
    fragments:
    - lot2-modules.yml
    modules:
    - description: Start a discovery on PowerProtect Data Manager
      name: discovery
      namespace: ''
    - description: Manage protection policies on PowerProtect Data Manager
      name: protection_policy
      namespace: ''
    - description: Assign or unassign assets to a protection policy on PowerProtect
        Data Manager
      name: protection_policy_assets
      namespace: ''
    - description: Get protection policies from PowerProtect Data Manager
      name: protection_policy_info
      namespace: ''
    - description: Run a protection policy now on PowerProtect Data Manager
      name: protection_policy_run
      namespace: ''
    - description: Manage protection rules on PowerProtect Data Manager
      name: protection_rule
      namespace: ''
    - description: Get protection rules from PowerProtect Data Manager
      name: protection_rule_info
      namespace: ''
    - description: Run protection rules or preview their conflicts on PowerProtect
        Data Manager
      name: protection_rule_run
      namespace: ''
    release_date: '2026-11-15'
  0.3.0:
    changes:
      breaking_changes:
      - kubernetes.add_policy_and_rule playbook - now creates or updates the rule
        (before, it only created it when missing) and runs only that rule (before,
        all Kubernetes rules). The ``protection.create_rule`` and ``protection.run_rule``
        playbook variables changed accordingly.
      - protection_rule - now uses the v3 rule API. The options ``conditions`` and
        ``condition_connector`` are replaced by ``filters`` (the object subtype goes
        in ``filters[].objectSubtype``, there is no ``object_subtypes`` option), ``tenant``
        is removed, ``policy`` is replaced by ``action`` plus ``protection_policy``
        (or ``protection_policy_id``), and ``action`` lost ``MOVE_TO_GROUP`` and takes
        the v3 action names. New options are ``variant``, ``scopes``, ``categories``,
        ``resource_group`` and ``resource_group_id``.
      - protection_rule and protection_rule_info - the returned objects (``protection_rule``,
        ``protection_rules``) now have the v3 shape, for example ``action`` is a dict
        instead of a string, and ``inventorySourceType`` and ``conditions`` are gone.
      - protection_rule_run - ``rule`` keeps its name but is now a required rule name
        or id (a string), no longer a ProtectionRule dict (the preview body). The
        module runs one rule per call, the old ``rules`` list ran several rules or
        all rules of an inventory source type. ``inventory_source_type`` is replaced
        by ``object_subtypes``, and ``preview_action`` is removed (``action_name``
        is the run action, the preview ignores it).
      minor_changes:
      - Adds the modules resource_group, resource_group_info, protection_group, protection_group_info,
        asset_info and host_info.
      - asset_info omits the top-level ``credentials`` field of the assets it returns;
        host_info omits nothing.
      release_summary: Moves the protection rule modules to the v3 rule API and adds
        resource group, protection group, asset and host modules.
    fragments:
    - lot3-rules-v3.yml
    modules:
    - description: Get assets from PowerProtect Data Manager
      name: asset_info
      namespace: ''
    - description: Get hosts from PowerProtect Data Manager
      name: host_info
      namespace: ''
    - description: Manage protection groups on PowerProtect Data Manager
      name: protection_group
      namespace: ''
    - description: Get protection groups from PowerProtect Data Manager
      name: protection_group_info
      namespace: ''
    - description: Manage resource groups on PowerProtect Data Manager
      name: resource_group
      namespace: ''
    - description: Get resource groups from PowerProtect Data Manager
      name: resource_group_info
      namespace: ''
    release_date: '2026-11-15'
  0.4.0:
    changes:
      breaking_changes:
      - certificate - the option ``port`` (TLS port of the host) is renamed ``host_port``.
        ``port`` now means the PPDM connection port, as in every other module; use
        ``host_port`` for the TLS port of the host presenting the certificate.
      bugfixes:
      - certificate - the ``port`` option shadowed the PPDM connection port, so the
        module connected to PPDM on the TLS port of the host; this is fixed by the
        ``host_port`` rename.
      - discovery, protection_policy_run and protection_rule_run - with ``wait=true``
        a finished activity was reported as failed because the v3 statuses ``SUCCESS``
        and ``COMPLETED_WITH_EXCEPTIONS`` were not recognised (only the v2 ``OK``
        and ``OK_WITH_ERRORS``). Both sets are now accepted.
      known_issues:
      - user and user_info use the v2 users API (``/api/v2/users``), which PPDM 20.3.0
        marks deprecated in favour of ``/api/v3/identity-access-provisions``.
      minor_changes:
      - Adds the modules activity_info, activity_action, alert_info, alert_acknowledge,
        copy_info, smtp_info, smtp, user_info, user, role_info, restore_plan_info,
        restore_plan, restore_plan_run, upgrade_package_info and upgrade_package_action.
      - Adds the playbooks assets.find_assets, protection.create_resource_group and
        protection.create_protection_group.
      - The shared ``ensure`` and ``remove`` helpers handle singleton objects (for
        example the SMTP configuration) with ``key=None``.
      - The shared info helper gains a ``name_key`` argument (the object field the
        ``name`` option is matched against).
      release_summary: Adds monitoring and operations modules (activities, alerts,
        copies, SMTP, users and roles, restore plans, upgrade packages) and three
        playbooks (66 in total), and fixes waited activities on the v3 statuses. The
        upgrade and restore modules are service-affecting and untested on a live appliance.
    fragments:
    - certificate-host-port.yml
    - lot4-monitoring-ops.yml
    modules:
    - description: Cancel or retry an activity on PowerProtect Data Manager
      name: activity_action
      namespace: ''
    - description: Get activities from PowerProtect Data Manager
      name: activity_info
      namespace: ''
    - description: Acknowledge or unacknowledge alerts on PowerProtect Data Manager
      name: alert_acknowledge
      namespace: ''
    - description: Get alerts from PowerProtect Data Manager
      name: alert_info
      namespace: ''
    - description: Get copies (backups) from PowerProtect Data Manager
      name: copy_info
      namespace: ''
    - description: Manage restore plans on PowerProtect Data Manager
      name: restore_plan
      namespace: ''
    - description: Get restore plans from PowerProtect Data Manager
      name: restore_plan_info
      namespace: ''
    - description: Execute a restore plan on PowerProtect Data Manager
      name: restore_plan_run
      namespace: ''
    - description: Get roles from PowerProtect Data Manager
      name: role_info
      namespace: ''
    - description: Manage the SMTP configuration of PowerProtect Data Manager
      name: smtp
      namespace: ''
    - description: Get the SMTP configuration from PowerProtect Data Manager
      name: smtp_info
      namespace: ''
    - description: Precheck, install or revert an upgrade package on PowerProtect
        Data Manager
      name: upgrade_package_action
      namespace: ''
    - description: Get upgrade packages from PowerProtect Data Manager
      name: upgrade_package_info
      namespace: ''
    - description: Manage local users of PowerProtect Data Manager
      name: user
      namespace: ''
    - description: Get users from PowerProtect Data Manager
      name: user_info
      namespace: ''
    release_date: '2026-11-16'
  1.0.0:
    changes:
      bugfixes:
      - Client - a short page without ``page.totalPages`` is now the last page instead
        of an error, the ``/api/v2/server-disaster-recovery-configurations`` endpoint
        of PPDM 20.3 sends none (found by running a playbook on a live lab). A full
        page without ``totalPages`` still fails.
      - ensure (every module that updates with PATCH, for example resource_group,
        protection_rule, protection_group and restore_plan) - the PATCH body now carries
        the object ``id``, PPDM 20.3 answers HTTP 400 without it (found on a live
        lab).
      - protection_group - a new group gets ``subtype`` ``GENERIC`` when the option
        is not set, PPDM 20.3 rejects a group without a subtype. An existing group
        keeps its subtype.
      - protection_policy - timestamps such as ``window.startTime`` are compared as
        instants, PPDM stores ``...00.000Z`` as ``...00Z`` and every re-run reported
        a change (found on a live lab).
      minor_changes:
      - Add the ``tls_server_name`` connection option (env ``PPDM_TLS_SERVER_NAME``)
        to verify the PPDM certificate, and send SNI, against a name other than ``hostname``;
        chain verification stays on.
      - protection_rule - new ``filter_template`` option (the ``filterTemplate`` field).
        PPDM 20.3 builds the rule filters from a template, and for an ``ASSIGN_RESOURCE_GROUP``
        rule it requires ``priority`` and ``filters`` to be unset.
      - protection_rule_run - new ``all_rules_of_action`` option. PPDM 20.3 answers
        HTTP 400 when a single ``ASSIGN_PROTECTION_POLICY`` rule is run by ``ruleId``,
        it only runs every rule of the action. The module now fails before any request
        unless the option is set, then sends the action without ``ruleId``.
      release_summary: First stable release. The modules and playbooks were exercised
        against a disposable PowerProtect Data Manager 20.3.0 appliance and the bugs
        found there are fixed. Paths that need a vCenter, a Data Domain or protected
        data could not be run, the README lists what was validated and what was not.
    fragments:
    - lab-validation-fixes.yml
    - release-summary.yml
    - tls-server-name.yml
    release_date: '2026-11-16'
