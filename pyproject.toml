[project]
name = "ansible-ppdm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ansible-core>=2.21.6",
    "ansible-creator>=26.11.0",
    "ansible-lint>=26.11.0",
    "antsibull-changelog>=0.37.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
force-exclude = true
line-length = 120
target-version = "py310"
extend-exclude = [".superpowers", ".venv", ".ansible_collections", "docs/openapi", "plugins/module_utils/_routes.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Ansible modules put DOCUMENTATION/EXAMPLES/RETURN before imports (validate-modules requires it).
"plugins/modules/*.py" = ["E402"]
"tests/**" = []

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
