---
# Publishes to Ansible Galaxy when a version tag (vX.Y.Z) is pushed.
# Needs the repository secret ANSIBLE_GALAXY_API_KEY (Galaxy API token).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag matches galaxy.yml
        run: |
          version=$(sed -n 's/^version: *//p' galaxy.yml)
          test "v$version" = "$GITHUB_REF_NAME"
          # SemVer pre-release: major 0 or a - suffix
          case "$version" in 0.*|*-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; esac
      # uvx: only ansible-core, not the dev dependency group, in the job that holds the Galaxy token
      - run: uvx --from ansible-core ansible-galaxy collection build --force --output-path dist
      - name: Publish to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_SERVER_LIST: release_galaxy
          ANSIBLE_GALAXY_SERVER_RELEASE_GALAXY_URL: https://galaxy.ansible.com/
          ANSIBLE_GALAXY_SERVER_RELEASE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: uvx --from ansible-core ansible-galaxy collection publish dist/*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" $PRERELEASE --generate-notes
