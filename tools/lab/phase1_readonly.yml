---
# Live-lab validation, phase 1: every *_info module, read-only.
# Run from the repo root (see tools/lab/README.md). Raw results go to .ansible/lab-results/ (git-ignored).
- name: Phase 1 read-only validation
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      ca_path: "{{ lookup('ansible.builtin.env', 'LAB_CA_PATH') }}"
      tls_server_name: "{{ lookup('ansible.builtin.env', 'LAB_TLS_SERVER_NAME') }}"
  vars:
    results_dir: "{{ playbook_dir }}/../../.ansible/lab-results"
  tasks:
    - name: Create the results directory
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0700"

    - name: Call activity_info
      fjacquet.ppdm.activity_info:
      register: r_activity_info
      failed_when: false

    - name: Save the raw activity_info result
      ansible.builtin.copy:
        content: "{{ r_activity_info | to_nice_json }}"
        dest: "{{ results_dir }}/activity_info.json"
        mode: "0600"

    - name: Call alert_info
      fjacquet.ppdm.alert_info:
      register: r_alert_info
      failed_when: false

    - name: Save the raw alert_info result
