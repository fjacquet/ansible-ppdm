module: certificate
resource: certificates
key: host
kind: ensure
short_description: Trust or remove a host certificate on PowerProtect Data Manager
description:
  - Manage the trust store entry of a remote host certificate (C(/api/v2/certificates)).
  - With C(state=present) the certificate presented by I(host):I(port) is fetched through PPDM and accepted with a PUT (a POST when the entry has no ID).
  - Secure by default, C(state=present) requires I(fingerprint), the presented fingerprint must match it. Without it the module fails unless I(accept_any_certificate=true).
  - With a I(fingerprint) pin, the states C(UNKNOWN), C(MISMATCHED) and C(REJECTED) are accepted, C(EXPIRED), C(MALFORMED) and any other state fail. A certificate already C(ACCEPTED) with a different fingerprint than the pin fails, it is never reported as unchanged.
  - With I(accept_any_certificate=true) only C(UNKNOWN) is accepted, every other non-C(ACCEPTED) state fails.
  - With C(state=absent) the entry is deleted when it is currently C(ACCEPTED).
  - A real C(state=present) run does the GET without C(nocache), per the API this retrieves the remote certificate and stores it in the trust store in a non-accepted state, BEFORE the I(fingerprint) pin is checked, and the entry stays there when the pin does not match (by design, PPDM exposes no side-effect-free way to read the presented certificate). Check mode and C(state=absent) use C(nocache=true) so they never write to the trust store.
  - Entries are matched on exact I(host) (case-insensitive), I(port) and I(type). More than one match fails.
  - With C(state=absent) an API entry without a C(type) is not matched, so C(changed=false) can mean "not found by this module".
version_added: 0.1.0
attributes:
  check_mode:
    support: full
  diff_mode:
    support: full
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - A real C(state=present) run stores the fetched certificate in the PPDM trust store before the fingerprint pin is checked.
seealso:
  - module: fjacquet.ppdm.certificate_info
    description: List trusted certificates.
options:
  state:
    type: str
    choices: [present, absent]
    default: present
    description: C(present) accepts (trusts) the certificate, C(absent) removes it from the trust store.
  host:
    type: str
    required: true
    description: Host name or IP address presenting the certificate.
  port:
    type: int
    default: 443
    description: TLS port of the host.
  type:
    type: str
    choices: [HOST, ROOT, INTERMEDIATE]
    default: HOST
    description: Certificate type to fetch.
  fingerprint:
    type: str
    description:
      - Expected fingerprint of the presented certificate, as shown by PPDM (hex, with or without C(:) separators, case-insensitive). Whitespace and C(:) are ignored, what remains must be one or more hex digits, otherwise the module fails before sending any request.
      - Required for C(state=present) unless I(accept_any_certificate=true).
  accept_any_certificate:
    type: bool
    default: false
    description:
      - Insecure, trusts whatever certificate the host presents (only state C(UNKNOWN)). A warning is issued when used.
      - Only for C(state=present) without I(fingerprint).
examples: |
  - name: Trust the certificate of a Data Domain
    fjacquet.ppdm.certificate:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      host: dd01.example.com
      port: 3009
      fingerprint: "AB:CD:EF:..."

  - name: Trust whatever the host presents (insecure)
    fjacquet.ppdm.certificate:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      host: lab-dd.example.com
      port: 3009
      accept_any_certificate: true

  - name: Remove the trust
    fjacquet.ppdm.certificate:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      host: dd01.example.com
      port: 3009
      state: absent
return: |
  certificate:
    description: The certificate entry (empty when absent and nothing was trusted).
    returned: success
    type: dict
    sample: {"id": "c1", "host": "dd01.example.com", "port": 3009, "type": "HOST", "state": "ACCEPTED"}
  diff:
    description: Before and after.
    returned: success
    type: dict
    sample: {"before": {"state": "UNKNOWN"}, "after": {"state": "ACCEPTED"}}
