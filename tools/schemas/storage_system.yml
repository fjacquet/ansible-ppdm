module: storage_system
resource: storage-systems
key: name
kind: ensure
short_description: Update a storage system on PowerProtect Data Manager
description:
  - Update an existing storage system, identified by its name.
  - Storage systems cannot be created or deleted through the API in 20.3.0, they appear when an inventory source is added; the module fails if none matches.
options:
  state:
    type: str
    choices: [present]
    default: present
    description: Only C(present) is supported.
  name:
    type: str
    required: true
    description: Name of the existing storage system, used as the key.
  description:
    type: str
    description: Storage system description.
  location_id:
    type: str
    description: ID of the location of the storage system.
  dd_location_id:
    type: str
    description: ID of the location for the PowerProtect Data Domain.
  config:
    type: dict
    description:
      - The module also fails when C(config) contains C(id) or C(_links), the server owns them.
      - The module fails when C(config) contains a key that a named option sets (C(name), C(description), C(locationId) and C(ddLocationId)), use the option instead.
      - Extra request body fields passed through as is (for example C(details)).
      - Each top-level key replaces the whole value of that field, the merge with the existing object is shallow (top-level keys only), nested values are not merged.
      - Do not put secrets here, values are not masked in diff or return values.
examples: |
  - name: Set a storage system description
    fjacquet.ppdm.storage_system:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: dd01.example.com
      description: Primary DD
return: |
  storage_system:
    description: The updated storage system.
    returned: success
    type: dict
  diff:
    description: Before and after.
    returned: success
    type: dict
