module: protection_rule_run
resource: protection-rules-execution
key: name
kind: action
short_description: Run protection rules or preview their conflicts on PowerProtect Data Manager
description:
  - Run protection rules now (C(POST /api/v2/protection-rules-execution)) so that PPDM applies them to the matching assets.
  - With I(preview=true) the module instead asks PPDM which conflicts a rule would cause, through C(POST /api/v2/protection-rules-conflicts-preview). This is read-only, it never changes anything and reports C(changed=false), also in check mode.
  - A run always reports C(changed=true) when it sends the request, it is not idempotent. In check mode nothing is sent and C(changed=true) is reported.
version_added: 0.2.0
attributes:
  check_mode:
    support: full
    details: A preview is read-only and is sent in check mode too.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - "The execution endpoint answers 200 without a body in the 20.3.0 OpenAPI, it does not return an activity. There is nothing to wait for, so the module has no I(wait) option, the rules are applied by PPDM asynchronously."
  - At least one of I(rules) and I(inventory_source_type) is required to run, the module fails before any request otherwise. A preview needs I(rule).
  - Rules are found by name first, then by id.
seealso:
  - module: fjacquet.ppdm.protection_rule
    description: Manage protection rules.
options:
  rules:
    description:
      - Names or ids of the rules to run (sent as C(assetRuleIds)).
    type: list
    elements: str
  inventory_source_type:
    description:
      - Run the rules of this inventory source type (the C(inventorySourceType) field of the execution request).
    type: str
    choices: [CLOUD_DIRECTOR_VAPP, CLOUD_NATIVE_ENTITY, DR, FILE_SYSTEM, GENERIC_APPLICATION_ASSET, HYPERV_VIRTUAL_MACHINE, KUBERNETES, MICROSOFT_EXCHANGE_DATABASE, MICROSOFT_SQL_DATABASE, NAS_SHARE, NATIVEEDGE_VIRTUAL_MACHINE, NUTANIX_VIRTUAL_MACHINE, ORACLE_DATABASE, POWERSTORE_BLOCK, SAP_HANA_DATABASE, VMWARE_VIRTUAL_MACHINE]
  preview:
    description:
      - Preview the conflicts of I(rule) instead of running rules.
    type: bool
    default: false
  preview_action:
    description:
      - Whether I(rule) is a rule to create or an edit of an existing rule (the C(previewAction) field). Used with I(preview=true) only.
    type: str
    choices: [CREATE, EDIT]
    default: CREATE
  rule:
    description:
      - Protection rule body to preview, in the PPDM C(ProtectionRule) format (C(name), C(action), C(inventorySourceType), C(actionResult), C(conditions)...). Required with I(preview=true), include its C(id) for I(preview_action=EDIT).
      - C(action), C(inventorySourceType), C(conditionConnector) and the C(operator) of each condition are checked before any request.
    type: dict
examples: |
  - name: Apply a rule now
    fjacquet.ppdm.protection_rule_run:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      rules: [gold-vms]

  - name: Preview the conflicts of a new rule
    fjacquet.ppdm.protection_rule_run:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      preview: true
      rule:
        name: gold-vms
        action: MOVE_TO_GROUP
        inventorySourceType: VMWARE_VIRTUAL_MACHINE
        actionResult: "{{ policy_id }}"
        conditions:
          - assetAttributeName: tag
            operator: EQUALS
            assetAttributeValues: ["gold"]
    register: conflicts
return: |
  response:
    description: Answer of PPDM to the execution request (usually empty).
    returned: when the request was sent and not a preview
    type: raw
  preview:
    description: Answer of PPDM to the conflicts preview, the protection rules in conflict (C(content)).
    returned: when I(preview=true)
    type: dict
    sample: {"content": [{"id": "1", "name": "other-rule"}]}
