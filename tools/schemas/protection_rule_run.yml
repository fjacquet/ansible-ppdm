module: protection_rule_run
resource: rules
key: name
kind: action
short_description: Run a protection rule or preview its conflicts on PowerProtect Data Manager
description:
  - Run a protection rule now (C(POST /api/v3/rule-execution)) so that PPDM applies it to the matching assets.
  - With I(preview=true) the module instead asks PPDM which conflicts the rule would cause, through C(POST /api/v3/protection-policy-rule-conflict-preview). This is read-only, it never changes anything and reports C(changed=false), also in check mode.
  - A run always reports C(changed=true) when it sends the request, it is not idempotent. In check mode nothing is sent and C(changed=true) is reported.
version_added: 0.2.0
attributes:
  check_mode:
    support: full
    details: A preview is read-only and is sent in check mode too.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - The rule is found by name first, then by id; the module fails when several rules match.
  - "The 20.3.0 OpenAPI documents the 202 answer of the execution endpoint without a body. With I(wait=true) the module expects an C(activityId) in the answer, polls it to completion and fails unless the activity ends C(OK) or C(SUCCESS) (the warn statuses C(OK_WITH_ERRORS), C(COMPLETED_WITH_EXCEPTIONS) only add a warning); an answer without C(activityId) fails the module. Without I(wait) the answer is returned as C(response) and nothing is polled."
  - Check mode reads the rule but sends no execution request.
seealso:
  - module: fjacquet.ppdm.protection_rule
    description: Manage protection rules.
options:
  rule:
    description:
      - Name or id of the protection rule.
    type: str
    required: true
  action_name:
    version_added: 0.3.0
    description:
      - Action of the rules to execute (the C(actionName) field of the execution request).
      - Defaults to the action of the rule, the module fails when that action cannot be executed.
    type: str
    choices: [ASSIGN_PROTECTION_POLICY, ASSIGN_RESOURCE_GROUP]
  object_subtypes:
    version_added: 0.3.0
    description:
      - Object subtypes to run the rule on (the C(objectSubtypes) field). Not sent when omitted.
    type: list
    elements: str
    choices: [CLOUD_DIRECTOR_VAPP, CLOUD_NATIVE_ENTITY, FILE_SYSTEM, GENERIC_APPLICATION_ASSET, HYPERV_VIRTUAL_MACHINE, KUBERNETES, MICROSOFT_EXCHANGE_DATABASE, MICROSOFT_SQL_DATABASE, NAS_SHARE, NATIVEEDGE_VIRTUAL_MACHINE, NUTANIX_VIRTUAL_MACHINE, ORACLE_DATABASE, POWERSTORE_BLOCK, POWER_MAX_BLOCK, SAP_HANA_DATABASE, VMWARE_VIRTUAL_MACHINE]
  all_rules_of_action:
    version_added: 0.4.1
    description:
      - PPDM 20.3 cannot run a single C(ASSIGN_PROTECTION_POLICY) rule, it answers HTTP 400 to a request with a C(ruleId) (verified on a live lab). It only runs every rule of that action.
      - Set to C(true) to run every C(ASSIGN_PROTECTION_POLICY) rule (limited by I(object_subtypes) when set). Without it the module fails for such a rule before any request.
      - Not used for C(ASSIGN_RESOURCE_GROUP) rules, which run by their own C(ruleId).
    type: bool
    default: false
  preview:
    description:
      - Preview the conflicts of the existing I(rule) instead of running it.
      - PPDM 20.3 supports the preview only for C(ASSIGN_PROTECTION_POLICY) rules (HTTP 400 for C(ASSIGN_RESOURCE_GROUP)), and answered HTTP 500 for a C(POWERSTORE_BLOCK) template rule on the lab.
      - Cannot be combined with I(wait).
    type: bool
    default: false
  wait:
    description:
      - Wait for the activity of the run to complete.
      - PPDM 20.3 answers the run with a 202 that echoes the request and has no C(activityId) (verified on a live lab), so the module fails with a clear message when this is set.
      - Fails unless the activity status is C(OK) or C(SUCCESS); C(OK_WITH_ERRORS) or C(COMPLETED_WITH_EXCEPTIONS) warns, and fails when the answer has no C(activityId).
    type: bool
    default: false
  wait_timeout:
    description:
      - Seconds to wait when I(wait=true).
    type: int
    default: 600
examples: |
  - name: Apply a rule now
    fjacquet.ppdm.protection_rule_run:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      rule: gold-vms

  - name: Apply a rule to Oracle databases only and wait for it
    fjacquet.ppdm.protection_rule_run:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      rule: gold-vms
      object_subtypes: [ORACLE_DATABASE]
      wait: true

  - name: Preview the conflicts of a rule
    fjacquet.ppdm.protection_rule_run:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      rule: gold-vms
      preview: true
    register: conflicts
return: |
  response:
    description: Answer of PPDM to the execution request.
    returned: when the server returned a body
    type: raw
  activities:
    description: Final activity when I(wait=true).
    returned: when waited
    type: list
    elements: dict
  warnings:
    description: OK_WITH_ERRORS or COMPLETED_WITH_EXCEPTIONS activities (when waited).
    returned: when any
    type: list
    elements: str
  preview:
    description: Answer of PPDM to the conflicts preview, the rules in conflict (C(content)).
    returned: when I(preview=true)
    type: dict
    sample: {"content": [{"id": "1", "name": "other-rule"}]}
