module: upgrade_package_info
resource: upgrade-packages
key: name
kind: info
short_description: Get upgrade packages from PowerProtect Data Manager
description:
  - Read-only query of upgrade packages. Never changes anything.
  - Returns every matching object, all pages.
  - The secret fields C(lockboxPassphrase) and C(upgradeToken) are never returned.
version_added: 0.4.0
attributes:
  check_mode:
    support: full
    details: Read-only, behaves the same in check mode.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - Use this module to follow an upgrade started with M(fjacquet.ppdm.upgrade_package_action), the appliance restarts during the upgrade, so poll it after the API is back (see the C(bootstrap.wait_for_api) playbook).
seealso:
  - module: fjacquet.ppdm.upgrade_package_action
    description: Precheck, install or revert an upgrade package.
options:
  name:
    type: str
    description: Return only the object whose name equals this value exactly (case-sensitive, checked again on the result, whatever the server filter returns). Mutually exclusive with I(filter) and I(id).
  filter:
    type: str
    description: PPDM filter string, for example C(state eq "AVAILABLE"). It is passed to PPDM unchanged and its result is not re-checked. Mutually exclusive with I(name) and I(id).
  id:
    type: str
    description: Return only the object with this ID. Mutually exclusive with I(name) and I(filter). A 404 answer gives an empty list.
  category:
    type: str
    choices: [ACTIVE, HISTORY]
    description: Return only packages of this category (exact match, combined with I(name) or I(filter) when given).
examples: |
  - name: Get the active upgrade package
    fjacquet.ppdm.upgrade_package_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      category: ACTIVE
    register: result
return: |
  upgrade_packages:
    description: Matching upgrade packages, an empty list when nothing matches.
    returned: always
    type: list
    elements: dict
    sample: [{"id": "u1", "name": "dellemc-ppdm-upgrade-sles-20.3.0-1.pkg", "state": "AVAILABLE", "category": "ACTIVE"}]
