module: inventory_source_info
resource: inventory-sources
kind: info
short_description: Get inventory sources from PowerProtect Data Manager
description:
  - Read-only query of inventory sources. Never changes anything.
  - Returns every matching object, all pages.
version_added: 0.1.0
attributes:
  check_mode:
    support: full
    details: Read-only, behaves the same in check mode.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
seealso:
  - module: fjacquet.ppdm.inventory_source
    description: Manage inventory sources.
options:
  name:
    type: str
    description: Return only the object whose name equals this value exactly (case-sensitive, checked again on the result, whatever the server filter returns). Mutually exclusive with I(filter) and I(id).
  filter:
    type: str
    description: PPDM filter string, for example C(name lk "prod%"). It is passed to PPDM unchanged and its result is not re-checked. Mutually exclusive with I(name) and I(id).
  id:
    type: str
    description: Return only the object with this ID. Mutually exclusive with I(name) and I(filter). A 404 answer gives an empty list, a 404 also happens when this PPDM version does not support the endpoint.
examples: |
  - name: List all inventory sources
    fjacquet.ppdm.inventory_source_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
    register: result

  - name: Get one by name
    fjacquet.ppdm.inventory_source_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: demo
return: |
  inventory_sources:
    description: Matching objects, an empty list when nothing matches.
    returned: always
    type: list
    elements: dict
    sample: [{"id": "1", "name": "vc1", "type": "VCENTER"}]
