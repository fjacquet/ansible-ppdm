module: host_info
resource: hosts
kind: info
short_description: Get hosts from PowerProtect Data Manager
description:
  - Read-only query of hosts. Never changes anything.
  - Returns every matching object, all pages.
  - The 20.3.0 schema of hosts has no password or token field, only credential IDs (references), so nothing is masked.
version_added: 0.3.0
attributes:
  check_mode:
    support: full
    details: Read-only, behaves the same in check mode.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - The 20.3.0 schema of hosts holds only credential IDs, never a password or token.
options:
  type:
    type: str
    description: Return only hosts of this type (exact match on the type field, for example C(APP_HOST) or C(ESX_HOST), combined with I(name) or I(filter) when given).
  name:
    type: str
    description: Return only the object whose name equals this value exactly (case-sensitive, checked again on the result, whatever the server filter returns). Mutually exclusive with I(filter) and I(id).
  filter:
    type: str
    description: PPDM filter string, for example C(name lk "prod%"). It is passed to PPDM unchanged and its result is not re-checked. Mutually exclusive with I(name) and I(id).
  id:
    type: str
    description: Return only the object with this ID. Mutually exclusive with I(name) and I(filter). A 404 or 204 answer gives an empty list, a 404 also happens when this PPDM version does not support the endpoint.
examples: |
  - name: List all hosts
    fjacquet.ppdm.host_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
    register: result

  - name: List application hosts
    fjacquet.ppdm.host_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      type: APP_HOST

return: |
  hosts:
    description: Matching objects, an empty list when nothing matches.
    returned: always
    type: list
    elements: dict
    sample: [{"id": "h1", "name": "db01", "type": "APP_HOST"}]
