module: restore_plan_info
resource: restore-plans
key: name
kind: info
short_description: Get restore plans from PowerProtect Data Manager
description:
  - Read-only query of restore plans. Never changes anything.
  - Returns every matching object, all pages.
version_added: 0.4.0
attributes:
  check_mode:
    support: full
    details: Read-only, behaves the same in check mode.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - The C(extendedData) of a restore group is free-form and may carry credentials. It is returned as is, not masked.
seealso:
  - module: fjacquet.ppdm.restore_plan
    description: Manage restore plans.
options:
  name:
    type: str
    description: Return only the object whose name equals this value exactly (case-sensitive, checked again on the result, whatever the server filter returns). Mutually exclusive with I(filter) and I(id).
  filter:
    type: str
    description: PPDM filter string, for example C(name lk "gold%"). It is passed to PPDM unchanged and its result is not re-checked. Mutually exclusive with I(name) and I(id).
  id:
    type: str
    description: Return only the object with this ID. Mutually exclusive with I(name) and I(filter). A 404 answer gives an empty list.
examples: |
  - name: List all restore plans
    fjacquet.ppdm.restore_plan_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
    register: result

  - name: Get one by name
    fjacquet.ppdm.restore_plan_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: dr-web
return: |
  restore_plans:
    description: Matching objects, an empty list when nothing matches.
    returned: always
    type: list
    elements: dict
    sample: [{"id": "1", "name": "dr-web"}]
