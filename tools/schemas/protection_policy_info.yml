module: protection_policy_info
resource: protection-policies
kind: info
short_description: Get protection policies from PowerProtect Data Manager
description:
  - Read-only query of protection policies. Never changes anything.
  - Returns every matching object, all pages.
version_added: 0.2.0
attributes:
  check_mode:
    support: full
    details: Read-only, behaves the same in check mode.
  diff_mode:
    support: none
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
seealso:
  - module: fjacquet.ppdm.protection_policy
    description: Manage protection policies.
options:
  asset_type:
    type: str
    choices: [CLOUD_DIRECTOR_VAPP, FILE_SYSTEM, GENERIC_APPLICATION_ASSET, HYPERV_VIRTUAL_MACHINE, KUBERNETES, MICROSOFT_EXCHANGE_DATABASE, MICROSOFT_SQL_DATABASE, NAS_SHARE, NATIVEEDGE_VIRTUAL_MACHINE, NUTANIX_VIRTUAL_MACHINE, ORACLE_DATABASE, POWERSTORE_BLOCK, POWER_MAX_BLOCK, SAP_HANA_DATABASE, VMWARE_VIRTUAL_MACHINE]
    description: Return only policies of this asset type (exact match, combined with I(name) or I(filter) when given).
  name:
    type: str
    description: Return only the object whose name equals this value exactly (case-sensitive, checked again on the result, whatever the server filter returns). Mutually exclusive with I(filter) and I(id).
  filter:
    type: str
    description: PPDM filter string, for example C(name lk "prod%"). It is passed to PPDM unchanged and its result is not re-checked. Mutually exclusive with I(name) and I(id).
  id:
    type: str
    description: Return only the object with this ID. Mutually exclusive with I(name) and I(filter). A 404 answer gives an empty list, a 404 also happens when this PPDM version does not support the endpoint.
examples: |
  - name: List all protection policies
    fjacquet.ppdm.protection_policy_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
    register: result

  - name: Get one by name
    fjacquet.ppdm.protection_policy_info:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: vm-gold
return: |
  protection_policies:
    description: Matching objects, an empty list when nothing matches.
    returned: always
    type: list
    elements: dict
    sample: [{"id": "1", "name": "vm-gold", "assetType": "VMWARE_VIRTUAL_MACHINE"}]
