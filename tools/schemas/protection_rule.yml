module: protection_rule
resource: rules
key: name
kind: ensure
short_description: Manage protection rules on PowerProtect Data Manager
description:
  - Create, update or remove a protection rule, identified by its name, through the v3 rules API.
  - A rule selects assets with I(filters) and applies its I(action), for example assigning them to a protection policy (I(action=ASSIGN_PROTECTION_POLICY)) or to a resource group (I(action=ASSIGN_RESOURCE_GROUP)).
  - Updates use PATCH.
  - Rule names are assumed to be unique (the rule is found by exact name); if two rules share the name the module fails and lists the IDs.
version_added: 0.3.0
attributes:
  check_mode:
    support: full
  diff_mode:
    support: full
notes:
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - The C(Rule) schema of the 20.3.0 OpenAPI has no required field.
  - The server-owned fields C(createdAt), C(updatedAt), C(lastRunAt), C(lastMigratedAt), C(status) and C(uniqueHash) are never sent and are ignored by the idempotence check.
  - I(filters) replaces the whole list on PPDM, and is compared in order. A run is unchanged when each desired filter is a subset of the existing one at the same index (same list length), so fields PPDM adds do not cause a change.
  - The same subset rule applies to the action, including the C(args) list (same order and length).
  - The nested C(fieldData) of a relational condition is passed to PPDM as given, only the operators and the enum values are checked.
  - The rule is applied to the assets by PPDM on its own schedule, or on demand with M(fjacquet.ppdm.protection_rule_run).
seealso:
  - module: fjacquet.ppdm.protection_rule_info
    description: List protection rules.
  - module: fjacquet.ppdm.protection_rule_run
    description: Run protection rules or preview their conflicts.
  - module: fjacquet.ppdm.protection_policy
    description: Manage protection policies.
options:
  state:
    type: str
    choices: [present, absent]
    default: present
    description: Whether the rule must exist.
  name:
    type: str
    required: true
    description: Rule name, used as the key.
  description:
    type: str
    description: Rule description.
  priority:
    type: int
    description: Priority of the rule, 1 is the highest priority.
  action:
    type: str
    choices: [ASSIGN_PROTECTION_POLICY, ASSIGN_RESOURCE_GROUP, SELECT_ASSETS_FOR_RESTORE_PLAN, SELECT_COPIES, SELECT_COPIES_FOR_RESTORE_PLAN, SELECT_FILES]
    description:
      - Action name of the rule (the C(action.name) field).
      - I(protection_policy) and I(protection_policy_id) require C(ASSIGN_PROTECTION_POLICY), I(resource_group) and I(resource_group_id) require C(ASSIGN_RESOURCE_GROUP).
  protection_policy:
    type: str
    description: Name of the protection policy the matching assets are assigned to, resolved to its id (sent as the C(PROTECTION_POLICY_ID) action argument). The module fails when no policy or several policies have this name. Mutually exclusive with I(protection_policy_id).
  protection_policy_id:
    type: str
    description: Id of the protection policy, used as is. Mutually exclusive with I(protection_policy).
  resource_group:
    type: str
    description: Name of the resource group the matching assets are assigned to, resolved to its id (sent as the C(RESOURCE_GROUP_ID) action argument). The module fails when no group or several groups have this name. Mutually exclusive with I(resource_group_id).
  resource_group_id:
    type: str
    description: Id of the resource group, used as is. Mutually exclusive with I(resource_group).
  variant:
    type: str
    choices: [ADVANCED, EXCLUDE_FILE_NAME_AND_PATH, INCLUDE_EXCLUDE_ALL_FIELDS, INCLUDE_FILE_NAME_AND_PATH, INCLUDE_FILE_PATH, SIMPLE]
    description: Variant of the rule.
  scopes:
    type: list
    elements: str
    choices: [ASSET, GENERAL, POLICY]
    description: Scopes of the rule.
  categories:
    type: list
    elements: str
    choices: [LIST_VIEW, TREE_VIEW]
    description: Categories of the rule.
  filters:
    type: list
    elements: dict
    description:
      - Filters that select the assets, passed to PPDM as is after validation (the C(filters) field). The list replaces the whole list on PPDM and is compared in order.
      - Each filter is a dict with C(objectType), C(objectSubtype), C(type) (C(INCLUDE) or C(EXCLUDE)), C(operator) and C(conditions). Each condition is either logical (C(operator) C(AND) or C(OR) and a nested C(conditions) list) or relational (C(fieldName), C(operator) and C(fieldData)). The enum values are checked, nesting is limited to 8 levels.
  config:
    type: dict
    description:
      - Extra request body fields passed through as is, for example C(filter).
      - The module fails when C(config) contains C(id) or C(_links), the server owns them.
      - The module fails when C(config) contains a key that a named option sets (C(name), C(description), C(priority), C(action), C(variant), C(scopes), C(categories) and C(filters)), use the option instead.
      - Each top-level key replaces the whole value of that field, the merge with the existing object is shallow (top-level keys only).
      - Do not put secrets here, values are not masked in diff or return values.
examples: |
  - name: Assign every VM tagged gold to the vm-gold policy
    fjacquet.ppdm.protection_rule:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: gold-vms
      priority: 10
      action: ASSIGN_PROTECTION_POLICY
      protection_policy: vm-gold
      filters:
        - objectType: ASSET
          objectSubtype: VMWARE_VIRTUAL_MACHINE
          type: INCLUDE
          operator: AND
          conditions:
            - operator: AND
              conditions:
                - fieldName: tags
                  operator: EQUALS
                  fieldData:
                    type: STRING
                    values: ["gold"]

  - name: Remove a rule
    fjacquet.ppdm.protection_rule:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: gold-vms
      state: absent
return: |
  protection_rule:
    description: The managed protection rule.
    returned: success
    type: dict
    sample: {"id": "1", "name": "gold-vms", "action": {"name": "ASSIGN_PROTECTION_POLICY"}}
  diff:
    description: Before and after.
    returned: success
    type: dict
    sample: {"before": {}, "after": {"name": "gold-vms"}}
