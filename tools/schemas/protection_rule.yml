module: protection_rule
resource: protection-rules
key: name
kind: ensure
short_description: Manage protection rules on PowerProtect Data Manager
description:
  - Create, update or remove a protection rule (an automatic assignment rule, called asset rule by the API), identified by its name, through the v2 API.
  - A rule moves the assets that match its I(conditions) to a protection policy (I(action=MOVE_TO_GROUP), the policy is the C(actionResult)).
  - Updates use PUT.
  - Rule names are assumed to be unique (the rule is found by exact name); if two rules share the name the module fails and lists both IDs.
version_added: 0.2.0
attributes:
  check_mode:
    support: full
  diff_mode:
    support: full
notes:
  - The v2 protection rule API is deprecated since PPDM 20.2 and removed in 20.6, the module will move to the v3 API in a later release.
  - Unofficial collection, not affiliated with Dell. Written against the PowerProtect Data Manager 20.3.0 REST API.
  - "The C(ProtectionRule) schema of the 20.3.0 OpenAPI has no required field. The conditions are a list of C(Condition) objects (C(assetAttributeName), C(operator), C(assetAttributeValues)), the nested C(rules) list of the API is not a named option, use I(config) for it."
  - The server-owned fields C(assignedAssetsCount), C(displayDescription), C(lastRunAt) and C(_embedded) are never sent back in a PUT and are ignored by the idempotence check.
  - I(conditions) replaces the whole list on PPDM. A run is unchanged when each desired condition is a subset of the existing one at the same index (same list length), so fields PPDM adds do not cause a change.
  - The rule is applied to the assets by PPDM on its own schedule, or on demand with M(fjacquet.ppdm.protection_rule_run).
seealso:
  - module: fjacquet.ppdm.protection_rule_info
    description: List protection rules.
  - module: fjacquet.ppdm.protection_rule_run
    description: Run protection rules or preview their conflicts.
  - module: fjacquet.ppdm.protection_policy
    description: Manage protection policies.
options:
  state:
    type: str
    choices: [present, absent]
    default: present
    description: Whether the rule must exist.
  name:
    type: str
    required: true
    description: Rule name, used as the key.
  description:
    type: str
    description: Rule description.
  action:
    type: str
    choices: [MOVE_TO_GROUP]
    description: Action of the rule, C(MOVE_TO_GROUP) moves the matching assets to the protection policy of I(policy).
  inventory_source_type:
    type: str
    choices: [AVAMAR_ASSET, CLOUD_DIRECTOR_VAPP, CLOUD_NATIVE_ENTITY, FILE_SYSTEM, GENERIC_APPLICATION_ASSET, HYPERV_VIRTUAL_MACHINE, KUBERNETES, MICROSOFT_EXCHANGE_DATABASE, MICROSOFT_SQL_DATABASE, NAS_SHARE, NATIVEEDGE_VIRTUAL_MACHINE, NUTANIX_VIRTUAL_MACHINE, ORACLE_DATABASE, POWERSTORE_BLOCK, POWER_MAX_BLOCK, SAP_HANA_DATABASE, VMWARE_VIRTUAL_MACHINE]
    description: Inventory source type the rule is for (the C(inventorySourceType) field).
  priority:
    type: int
    description: Priority of the rule, a rule of high priority runs first.
  conditions:
    type: list
    elements: dict
    description:
      - Conditions that select the assets, passed to PPDM as is after validation (the C(conditions) field).
      - Each item is a dict with C(assetAttributeName), C(operator) and C(assetAttributeValues) (a list of strings). C(operator) is checked against C(IN), C(NOT_IN), C(EQUALS), C(CONTAINS), C(BEGINS_WITH), C(ENDS_WITH), C(DOES_NOT_EQUAL), C(DOES_NOT_CONTAIN), C(LESS_THAN), C(GREATER_THAN), C(REGULAR_EXPRESSION), C(MATCH_REGEX), C(DOES_NOT_MATCH_REGEX), C(GREATER_THAN_OR_EQUAL_TO) or C(LESS_THAN_OR_EQUAL_TO), the valid attribute names depend on I(inventory_source_type).
  condition_connector:
    type: str
    choices: [AND, NONE, OR]
    description: Operator that joins the conditions (the C(conditionConnector) field, deprecated by PPDM 20.3.0 in favour of C(logicalOperator), which can be set in I(config)).
  policy:
    type: str
    description: Protection policy name or id the matching assets are moved to (the C(actionResult) field). The policy is found by name first, then by id.
  tenant:
    type: str
    description: Id of the tenant that owns the rule (sent as C(tenant.id)).
  config:
    type: dict
    description:
      - The module also fails when C(config) contains C(id) or C(_links), the server owns them.
      - The module fails when C(config) contains a key that a named option sets (C(name), C(description), C(action), C(inventorySourceType), C(priority), C(conditions), C(conditionConnector), C(actionResult) and C(tenant)), use the option instead.
      - Extra request body fields passed through as is, for example C(logicalOperator).
      - Each top-level key replaces the whole value of that field, the merge with the existing object is shallow (top-level keys only).
      - Do not put secrets here, values are not masked in diff or return values.
examples: |
  - name: Assign every VM tagged gold to the vm-gold policy
    fjacquet.ppdm.protection_rule:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: gold-vms
      action: MOVE_TO_GROUP
      inventory_source_type: VMWARE_VIRTUAL_MACHINE
      priority: 10
      policy: vm-gold
      conditions:
        - assetAttributeName: tag
          operator: EQUALS
          assetAttributeValues: ["gold"]

  - name: Remove a rule
    fjacquet.ppdm.protection_rule:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: gold-vms
      state: absent
return: |
  protection_rule:
    description: The managed protection rule.
    returned: success
    type: dict
    sample: {"id": "1", "name": "gold-vms", "action": "MOVE_TO_GROUP", "actionResult": "2"}
  diff:
    description: Before and after.
    returned: success
    type: dict
    sample: {"before": {}, "after": {"name": "gold-vms", "action": "MOVE_TO_GROUP"}}
