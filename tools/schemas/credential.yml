module: credential
resource: credentials
key: name
kind: ensure
short_description: Manage credentials on PowerProtect Data Manager
description:
  - Create, update or remove a credential, identified by its name.
  - The password is never returned by PPDM and never shown in the result or the diff.
options:
  state:
    type: str
    choices: [present, absent]
    default: present
    description: Whether the credential must exist.
  name:
    type: str
    required: true
    description: Credential name, used as the unique key.
  type:
    type: str
    choices: [DATADOMAIN, POWERPROTECT, DBUSER, OS, RMAN, STANDARD, VCENTER, KUBERNETES, CDR, SAPHANA_DB_USER, SAPHANA_SYSTEMDB_USER, DDBOOST, NAS, CLOUD_SNAPSHOT_MANAGER, CLOUD_DIRECTOR, AVAMAR, HYPERV, DELL_ECS, NUTANIX, NATIVE_EDGE, MS_AZURE, MS_GMSA, NT_AUTHORITY, AMAZON_S3, GENERIC_S3]
    description: Credential account type. Required when I(state=present).
  method:
    type: str
    choices: [BASIC, TOKEN, CONFIG, USER_KEY, OIDC_REFRESH_TOKEN]
    description: Credential method.
  cred_username:
    type: str
    description:
      - Username of the stored credential account. This is not the PPDM login, which is the connection option C(username).
      - Required when I(state=present).
  cred_password:
    type: str
    no_log: true
    description:
      - Password of the stored credential account. This is not the PPDM login, which is the connection option C(password).
  update_password:
    type: str
    choices: [on_create, always]
    default: on_create
    description:
      - C(on_create) never compares the password and never causes a change by itself; it is sent on create and whenever an update is sent for another difference.
      - C(always) forces an update on every run (always reports changed) and sends the password, because PPDM never returns it.
examples: |
  - name: Ensure a Data Domain credential
    fjacquet.ppdm.credential:
      hostname: ppdm.example.com
      username: admin
      password: "{{ ppdm_password }}"
      name: dd01
      type: DATADOMAIN
      cred_username: sysadmin
      cred_password: "{{ dd_password }}"
return: |
  credential:
    description: The managed credential, password masked.
    returned: success
    type: dict
  diff:
    description: Before and after, password masked.
    returned: success
    type: dict
