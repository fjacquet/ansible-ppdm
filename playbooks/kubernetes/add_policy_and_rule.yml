---
# Create a Kubernetes policy, a v3 rule assigning the Kubernetes assets with a label to it, and run the rule.
# Assumptions, not verified live: storageContainerId is the Data Domain storage system id, and the objective id is a to_uuid of the policy name.
# Inspired by bottkars/ansible_ppdm `130.2_playbook_add_k8s_policy_and_rule.yaml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Create a Kubernetes policy and a label rule
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the change was confirmed
      ansible.builtin.assert:
        that: rule_exec_confirm | bool
        fail_msg: Set rule_exec_confirm to true, running the protection rules moves every matching Kubernetes asset to its policy.

    - name: Get the policy of that name
      fjacquet.ppdm.api:
        path: /api/v3/protection-policies
        query:
          filter: name eq "{{ k8s_policy_name }}"
      register: existing_policy

    - name: Get the Data Domain storage system
      fjacquet.ppdm.storage_system_info:
        name: "{{ ddve_hostname }}"
      register: policy_storage_system

    - name: Check that the storage system exists
      ansible.builtin.assert:
        that: policy_storage_system.storage_systems | length == 1
        fail_msg: No storage system named {{ ddve_hostname }}.

    - name: Check that the Data Domain has a preferred interface
      ansible.builtin.assert:
        that: >-
          (preferred_interface_id | default('', true) | length > 0) or
          (policy_storage_system.storage_systems[0].details.dataDomain.preferredInterfaces | default([]) | length > 0)
        fail_msg: The Data Domain has no preferred interface; set preferred_interface_id explicitly.

    - name: Create the Kubernetes protection policy
      fjacquet.ppdm.api:
        method: POST
        path: /api/v3/protection-policies
        body:
          assetType: KUBERNETES
          name: "{{ k8s_policy_name }}"
          description: Kubernetes policy created by Ansible
          purpose: CENTRALIZED
          objectives:
            - id: "{{ (k8s_policy_name ~ '-backup') | to_uuid }}"
              type: BACKUP
              target:
                storageContainerId: "{{ policy_storage_system.storage_systems[0].id }}"
                preferredInterfaceId: "{{ preferred_interface_id if (preferred_interface_id | default('', true) | length > 0) else
                  policy_storage_system.storage_systems[0].details.dataDomain.preferredInterfaces[0].networkName }}"
              operations:
                - backupLevel: FULL
                  triggerType: ON_SCHEDULE
                  schedule:
                    recurrence:
                      pattern:
                        type: HOURLY
                        interval: 3
                    window:
                      startTime: "{{ policy_window_start }}"
                      duration: PT10H
              retentions:
                - time:
                    - type: RETENTION
                      unitType: DAY
                      unitValue: 3
              config:
                dataConsistency: CRASH_CONSISTENT
      when: existing_policy.result | length == 0
      register: created_policy

    - name: Ensure the protection rule
      fjacquet.ppdm.protection_rule:
        name: "{{ k8s_rule_name }}"
        action: ASSIGN_PROTECTION_POLICY
        priority: 1
        protection_policy: "{{ k8s_policy_name }}"
        filters:
          - objectType: ASSET
            objectSubtype: KUBERNETES
            type: INCLUDE
            operator: AND
            conditions:
              - operator: AND
                conditions:
                  - fieldName: userTags
                    operator: EQUALS
                    fieldData:
                      type: STRING
                      values:
                        - "{{ k8s_rule_label }}"

    - name: Run the protection rule
      fjacquet.ppdm.protection_rule_run:
        rule: "{{ k8s_rule_name }}"
        object_subtypes:
          - KUBERNETES
