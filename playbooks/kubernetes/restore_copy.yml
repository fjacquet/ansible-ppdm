---
# Restore the latest copy of a namespace (to a new namespace by default); refuses to run unless restore_confirm is true.
# Inspired by bottkars/ansible_ppdm `40.2-playbook_restore_k8s_asset_copies.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Restore a Kubernetes namespace from its latest copy
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the restore was confirmed
      ansible.builtin.assert:
        that: restore_confirm | bool
        fail_msg: Set restore_confirm to true, the restore overwrites persistent volume claims in the target namespace.

    - name: Get the namespace asset
      fjacquet.ppdm.api:
        path: /api/v2/assets
        query:
          filter: >-
            name eq "{{ namespace_name }}" and type eq "KUBERNETES" and subtype eq "K8S_NAMESPACE"
            and lastAvailableCopyTime ne null
      register: k8s_assets

    - name: Check that exactly one asset matches
      ansible.builtin.assert:
        that: k8s_assets.result | length == 1
        fail_msg: Expected exactly one namespace asset named {{ namespace_name }} with a copy.

    - name: Get the copies of the asset
      fjacquet.ppdm.api:
        path: "/api/v2/assets/{{ k8s_assets.result[0].id }}/copies"
      register: k8s_copies

    - name: Restore the latest copy to the target namespace
      fjacquet.ppdm.api:
        method: POST
        path: /api/v2/restored-copies
        body:
          description: "Restore namespace {{ namespace_name }} to {{ target_namespace_name }}"
          restoreType: "{{ restore_type }}"
          copyIds:
            - "{{ (k8s_copies.result | sort(attribute='createTime') | last).id }}"
          restoredCopiesDetails:
            targetK8sInfo:
              namespace: "{{ target_namespace_name }}"
              skipNamespaceResources: false
              targetInventorySourceId: "{{ k8s_assets.result[0].details.k8s.inventorySourceId }}"
              persistentVolumeClaims: >-
                {{ (k8s_copies.result | sort(attribute='createTime') | last).details.k8sBackup.persistentVolumeClaims
                   | default([]) }}
              overwritePersistentVolumeClaim: true
          options:
            includeClusterResources: false
        wait: true
        wait_timeout: 3600
      register: k8s_restore

    - name: Show the restore activity
      ansible.builtin.debug:
        var: k8s_restore.activity
