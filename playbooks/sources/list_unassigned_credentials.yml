---
# List credentials of type KUBERNETES that no consumer uses (read-only).
# Inspired by bottkars/ansible_ppdm `2.0-playbook_test_unassigned_credentials.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: List Kubernetes credentials not used by anything
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the unused Kubernetes credentials
      fjacquet.ppdm.credential_info:
        filter: type eq "KUBERNETES" and consumersCount eq 0
      register: unused_credentials

    - name: Show the unused credentials
      ansible.builtin.debug:
        msg: "{{ item.name }} ({{ item.id }})"
      loop: "{{ unused_credentials.credentials }}"
      loop_control:
        label: "{{ item.name }}"
