---
# Trust the vCenter certificate, create its credential and add it as an inventory source.
# Inspired by bottkars/ansible_ppdm `2.1-playbook_set_vsphere.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional), VCENTER_PASSWORD.
- name: Add a vCenter to PPDM
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Trust the vCenter certificate
      fjacquet.ppdm.certificate:
        host: "{{ vcenter_hostname }}"
        host_port: 443
        fingerprint: "{{ vcenter_fingerprint }}"

    - name: Ensure the vCenter credential
      fjacquet.ppdm.credential:
        name: "{{ vcenter_credential_name }}"
        type: VCENTER
        cred_username: "{{ vcenter_username }}"
        cred_password: "{{ lookup('ansible.builtin.env', 'VCENTER_PASSWORD') }}"
      no_log: true
      register: vcenter_credential

    - name: Ensure the vCenter inventory source
      fjacquet.ppdm.inventory_source:
        name: "{{ vcenter_hostname }}"
        type: VCENTER
        address: "{{ vcenter_hostname }}"
        source_port: 443
        credential_id: "{{ vcenter_credential.credential.id }}"
