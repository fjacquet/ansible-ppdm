---
# Install the active update package; refuses to run unless update_confirm is true.
# Confirming accepts the product and telemetry EULAs and trusts the package certificate on your behalf.
# Inspired by bottkars/ansible_ppdm `9.9-playbook_install_update_ppdm.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Install the active update package
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the install was confirmed
      ansible.builtin.assert:
        that: update_confirm | bool
        fail_msg: Set update_confirm to true, it installs the update, accepts the product and telemetry EULAs and trusts the package certificate.

    - name: Get the active update package
      fjacquet.ppdm.api:
        path: /api/v2/upgrade-packages
        query:
          filter: category eq "ACTIVE"
      register: update_packages
      no_log: true

    - name: Check that an update package is active
      ansible.builtin.assert:
        that: update_packages.result | length == 1
        fail_msg: Expected exactly one active update package.

    - name: Get the update package
      fjacquet.ppdm.api:
        path: "/api/v2/upgrade-packages/{{ update_packages.result[0].id }}"
      register: update_package
      no_log: true

    - name: Install the update package
      fjacquet.ppdm.api:
        method: PUT
        path: "/api/v2/upgrade-packages/{{ update_package.result.id }}"
        body: >-
          {{ update_package.result | combine({
            'state': 'INSTALLED',
            'certificateTrustedByUser': true,
            'eula': {'productEulaAccepted': true, 'telemetryEulaAccepted': true}
          }) }}
      no_log: true
