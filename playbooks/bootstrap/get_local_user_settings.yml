---
# Show the LOCAL_USER_SETTING common setting, the closest 20.3.0 equivalent of the community password policy (read-only).
# Inspired by bottkars/ansible_ppdm `9.10-playbook_get_password_policy.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Read the local user account settings (password policy)
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the local user settings
      fjacquet.ppdm.api:
        path: /api/v2/common-settings/LOCAL_USER_SETTING
      register: local_user_setting

    - name: Show the properties
      ansible.builtin.debug:
        var: local_user_setting.result.properties
