---
# Point the SDR configuration to the SysDR_<short name> unit of a Data Domain, keeping the existing credential.
# Inspired by bottkars/ansible_ppdm `3.0-playbook_set_sdr_existing_unit.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Use an existing SysDR storage unit for server disaster recovery
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the SDR configuration
      fjacquet.ppdm.api:
        path: /api/v2/server-disaster-recovery-configurations
      register: sdr_configurations
      no_log: true

    - name: Get the Data Domain storage system
      fjacquet.ppdm.storage_system_info:
        name: "{{ ddve_hostname }}"
      register: sdr_storage_system

    - name: Check that the SDR configuration and the storage system exist
      ansible.builtin.assert:
        that:
          - sdr_configurations.result | length == 1
          - sdr_storage_system.storage_systems | length == 1
        fail_msg: Expected one SDR configuration and one storage system named {{ ddve_hostname }}.

    - name: Set the SDR repository to the existing unit
      fjacquet.ppdm.api:
        method: PUT
        path: "/api/v2/server-disaster-recovery-configurations/{{ sdr_configurations.result[0].id }}"
        body: >-
          {{ sdr_configurations.result[0] | combine({
            'backupsEnabled': true,
            'repositoryHost': sdr_storage_system.storage_systems[0].id,
            'repositoryPath': 'SysDR_' ~ sdr_short_name,
            'repositoryFilesystem': 'BOOST_FILE_SYSTEM',
            'type': 'DATA_DOMAIN_SYSTEM',
            'credentialType': 'DDBOOST'
          }) }}
      when: sdr_configurations.result[0].repositoryPath | default('') != 'SysDR_' ~ sdr_short_name
      no_log: true
