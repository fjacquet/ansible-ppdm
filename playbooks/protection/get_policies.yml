---
# List the protection policies (read-only). Protection policies exist only under /api/v3 in 20.3.0.
# Inspired by bottkars/ansible_ppdm `110.0_get_protection_policies.yaml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: List the protection policies
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the protection policies
      fjacquet.ppdm.api:
        path: /api/v3/protection-policies
      register: ppdm_policies

    - name: Show the policies
      ansible.builtin.debug:
        msg: "{{ item.name }} {{ item.id }} {{ item.assetType }}"
      loop: "{{ ppdm_policies.result }}"
      loop_control:
        label: "{{ item.name }}"
