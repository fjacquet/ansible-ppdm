---
# Run a protection policy now on the assets matching a filter and wait for the activities. Refuses to run unless policy_run_confirm is true.
# Inspired by bottkars/ansible_ppdm `110.4_playbook_start_policy.yaml`,
# `120.3_playbook_start_policy.yaml`,
# `130.4_playbook_start_k8s_policy.yaml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Run a protection policy now
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the run is confirmed
      ansible.builtin.assert:
        that: policy_run_confirm | bool
        fail_msg: Set policy_run_confirm=true to start the policy run.

    - name: Get the assets
      fjacquet.ppdm.api:
        path: /api/v2/assets
        query:
          filter: "{{ asset_filter }}"
      register: matched_assets

    - name: Check that assets match the filter
      ansible.builtin.assert:
        that:
          - asset_filter | length > 0
          - matched_assets.result | length > 0
        fail_msg: A non-empty asset_filter is required and at least one asset must match it ({{ asset_filter }}).

    - name: Run the protection policy
      fjacquet.ppdm.protection_policy_run:
        policy: "{{ policy_name }}"
        asset_ids: "{{ matched_assets.result | map(attribute='id') | list }}"
        wait: true
