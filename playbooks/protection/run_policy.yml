---
# Start the first objective of a protection policy found by name (POST /api/v3/protections).
# Inspired by bottkars/ansible_ppdm `110.4_playbook_start_policy.yaml`,
# `120.3_playbook_start_policy.yaml`,
# `130.4_playbook_start_k8s_policy.yaml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Run a protection policy now
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the protection policy
      fjacquet.ppdm.api:
        path: /api/v3/protection-policies
        query:
          filter: name eq "{{ policy_name }}"
      register: ppdm_policy

    - name: Check that exactly one policy matches
      ansible.builtin.assert:
        that: ppdm_policy.result | length == 1
        fail_msg: Expected exactly one protection policy named {{ policy_name }}.

    - name: Run the protection policy
      fjacquet.ppdm.api:
        method: POST
        path: /api/v3/protections
        body:
          policy:
            id: "{{ ppdm_policy.result[0].id }}"
            objectives:
              - id: "{{ ppdm_policy.result[0].objectives[0].id }}"
                operation:
                  backupLevel: "{{ backup_level }}"
