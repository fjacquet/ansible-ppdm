---
# Ensure a resource group, then a v3 rule that assigns the assets selected by resource_group_rule_filter_template (all VMs
# by default) to it. Both are updated when they differ (idempotent). Edit resource_group_rule_filter_template to select
# other assets. PPDM 20.3 builds the filters from the template and refuses a priority on a resource group rule.
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Create a resource group and its rule
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Ensure the resource group
      fjacquet.ppdm.resource_group:
        name: "{{ resource_group_name }}"
        description: "{{ resource_group_description }}"

    - name: Ensure the rule assigning assets to the resource group
      fjacquet.ppdm.protection_rule:
        name: "{{ resource_group_rule_name }}"
        action: ASSIGN_RESOURCE_GROUP
        resource_group: "{{ resource_group_name }}"
        filter_template: "{{ resource_group_rule_filter_template }}"
