---
# Start a discovery on an inventory source and wait for it, unless one is already running. Refuses to run unless discovery_confirm is true.
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Start a discovery on an inventory source
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the run is confirmed
      ansible.builtin.assert:
        that: discovery_confirm | bool
        fail_msg: Set discovery_confirm=true to start the discovery.

    - name: Start the discovery
      fjacquet.ppdm.discovery:
        inventory_source: "{{ discovery_inventory_source }}"
        ignore_running: true
        wait: true
