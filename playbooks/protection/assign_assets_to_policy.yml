---
# Assign the assets matching a filter to a policy; only the missing assignments are sent. Refuses to run unless assign_confirm is true.
# Inspired by bottkars/ansible_ppdm `120.2_playbook_add_assets_to_policy.yaml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Assign assets to a protection policy
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the run is confirmed
      ansible.builtin.assert:
        that: assign_confirm | bool
        fail_msg: Set assign_confirm=true to assign the assets to the policy.

    - name: Get the assets
      fjacquet.ppdm.api:
        path: /api/v2/assets
        query:
          filter: "{{ asset_filter }}"
      register: matched_assets

    - name: Check that assets match the filter
      ansible.builtin.assert:
        that:
          - asset_filter | length > 0
          - matched_assets.result | length > 0
        fail_msg: A non-empty asset_filter is required and at least one asset must match it ({{ asset_filter }}).

    - name: Assign the assets to the policy
      fjacquet.ppdm.protection_policy_assets:
        policy: "{{ policy_name }}"
        asset_ids: "{{ matched_assets.result | map(attribute='id') | list }}"
