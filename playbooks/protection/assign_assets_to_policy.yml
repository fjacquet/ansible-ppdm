---
# Assign the assets matching a filter to a policy (the body is a JSON array of asset ids).
# Inspired by bottkars/ansible_ppdm `120.2_playbook_add_assets_to_policy.yaml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Assign assets to a protection policy
  hosts: "{{ target | default('localhost') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the protection policy
      fjacquet.ppdm.api:
        path: /api/v3/protection-policies
        query:
          filter: name eq "{{ policy_name }}"
      register: ppdm_policy

    - name: Check that exactly one policy matches
      ansible.builtin.assert:
        that: ppdm_policy.result | length == 1
        fail_msg: Expected exactly one protection policy named {{ policy_name }}.

    - name: Get the assets to assign
      fjacquet.ppdm.api:
        path: /api/v2/assets
        query:
          filter: "{{ asset_filter }}"
      register: assets_to_assign

    - name: Assign the assets to the policy
      fjacquet.ppdm.api:
        method: POST
        path: "/api/v2/protection-policies/{{ ppdm_policy.result[0].id }}/asset-assignments"
        body: "{{ assets_to_assign.result | map(attribute='id') | list }}"
      when: assets_to_assign.result | length > 0
