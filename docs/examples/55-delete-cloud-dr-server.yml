---
# Delete the Cloud DR server deployment; refuses to run unless cloud_dr_confirm is true.
# Inspired by bottkars/ansible_ppdm `2.7-playbook_delete_cdrs_deployment.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Delete the Cloud DR server deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the deletion was confirmed
      ansible.builtin.assert:
        that: cloud_dr_confirm | bool
        fail_msg: Set cloud_dr_confirm to true to delete the Cloud DR server deployment.

    - name: Delete the Cloud DR server deployment
      fjacquet.ppdm.api:
        method: DELETE
        path: /api/v2/cloud-dr-server-deployment
