---
# Restore the latest copy of a VM to its original location; refuses to run unless restore_confirm is true.
# Inspired by bottkars/ansible_ppdm `40.1-playbook_restore_vm_asset_copies.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Restore a VM from its latest copy to production
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the restore was confirmed
      ansible.builtin.assert:
        that: restore_confirm | bool
        fail_msg: Set restore_confirm to true, a restore to production overwrites the VM.

    - name: Get the VM asset
      fjacquet.ppdm.api:
        path: /api/v2/assets
        query:
          filter: type eq "VMWARE_VIRTUAL_MACHINE" and protectionStatus eq "PROTECTED" and name eq "{{ vm_name }}"
      register: vm_assets

    - name: Check that exactly one asset matches
      ansible.builtin.assert:
        that: vm_assets.result | length == 1
        fail_msg: Expected exactly one protected VM named {{ vm_name }}.

    - name: Get the copies of the asset
      fjacquet.ppdm.api:
        path: "/api/v2/assets/{{ vm_assets.result[0].id }}/copies"
      register: vm_copies

    - name: Restore the latest copy to the original VM
      fjacquet.ppdm.api:
        method: POST
        path: /api/v2/restored-copies
        body:
          description: "Restore VM {{ vm_name }} to production"
          copyIds:
            - "{{ (vm_copies.result | sort(attribute='createTime') | last).id }}"
          restoreType: TO_PRODUCTION
          options:
            enableCompressedRestore: false
          restoredCopiesDetails:
            targetVmInfo:
              tagRestoreDirective: "OFF"
              spbmRestoreDirective: FROM_COPY
              recoverConfig: true
        wait: true
        wait_timeout: 3600
      register: vm_restore

    - name: Show the restore activity
      ansible.builtin.debug:
        var: vm_restore.activity
