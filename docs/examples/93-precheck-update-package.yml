---
# Start the precheck of the active update package and show its validation details.
# Inspired by bottkars/ansible_ppdm `9.9-playbook_precheck_update_ppdm.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Run the precheck of the active update package
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the active update package
      fjacquet.ppdm.api:
        path: /api/v2/upgrade-packages
        query:
          filter: category eq "ACTIVE"
      register: update_packages

    - name: Check that an update package is active
      ansible.builtin.assert:
        that: update_packages.result | length == 1
        fail_msg: Expected exactly one active update package.

    - name: Start the precheck
      fjacquet.ppdm.api:
        method: POST
        path: "/api/v2/upgrade-packages/{{ update_packages.result[0].id }}/precheck"
        wait: true

    - name: Read the package after the precheck
      fjacquet.ppdm.api:
        path: "/api/v2/upgrade-packages/{{ update_packages.result[0].id }}"
      register: update_package

    - name: Show the validation details
      ansible.builtin.debug:
        var: update_package.result.validationDetails
