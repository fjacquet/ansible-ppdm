---
# Show which objects use a credential (read-only).
# Inspired by bottkars/ansible_ppdm `2.0-playbook_test_unassigned_credentials_id.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: List the consumers of a credential
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the credential
      fjacquet.ppdm.credential_info:
        name: "{{ k8s_credential_name }}"
      register: usage_credential

    - name: Check that the credential exists
      ansible.builtin.assert:
        that: usage_credential.credentials | length == 1
        fail_msg: No credential named {{ k8s_credential_name }}.

    - name: Get the usage of the credential
      fjacquet.ppdm.api:
        path: "/api/v2/credentials/{{ usage_credential.credentials[0].id }}/usage"
      register: credential_usage

    - name: Show the usage
      ansible.builtin.debug:
        var: credential_usage.result
