---
# Add the root CA chain of the Kubernetes API server to the PPDM trust store (the chain is read from a local file).
# Inspired by bottkars/ansible_ppdm `playbook_set_k8s_root_cert.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Trust the root certificate of a Kubernetes API
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Add the root certificate chain
      fjacquet.ppdm.api:
        method: POST
        path: /api/v2/certificates
        body:
          host: "{{ k8s_hostname }}"
          port: "{{ k8s_port | string }}"
          type: ROOT
          verify: true
          certificateChain: "{{ lookup('ansible.builtin.file', certificate_chain_file) }}"
