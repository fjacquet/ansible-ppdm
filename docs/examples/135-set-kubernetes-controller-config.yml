---
# Replace one details.k8s.configurations entry (deep change, so a read-modify-write with the api module).
# Inspired by bottkars/ansible_ppdm `9.12-playbook_set_k8s_controller_config.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Set a controller option of a Kubernetes inventory source
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Check that the change was confirmed
      ansible.builtin.assert:
        that: inventory_update_confirm | bool
        fail_msg: Set inventory_update_confirm to true, this replaces the whole inventory source object.

    - name: Get the Kubernetes inventory source
      fjacquet.ppdm.inventory_source_info:
        name: "{{ k8s_hostname }}"
      register: k8s_source

    - name: Check that the inventory source exists
      ansible.builtin.assert:
        that: k8s_source.inventory_sources | length == 1
        fail_msg: No inventory source named {{ k8s_hostname }}.

    - name: Set the controller option
      fjacquet.ppdm.api:
        method: PUT
        path: "/api/v2/inventory-sources/{{ k8s_source.inventory_sources[0].id }}"
        body: >-
          {{ k8s_source.inventory_sources[0]
             | dict2items | rejectattr('key', 'in', ['_links', '_embedded']) | list | items2dict
             | combine({'details': {'k8s': k8s_source.inventory_sources[0].details.k8s | combine({'configurations':
               (k8s_source.inventory_sources[0].details.k8s.configurations | default([])
                | rejectattr('key', 'equalto', k8s_config_key) | list)
               + [{'key': k8s_config_key, 'type': 'CONTROLLER_CONFIG', 'value': k8s_config_value}]})}},
               recursive=true) }}
