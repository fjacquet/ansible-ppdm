---
# Log in and read the credentials: a failure here means the address, port or login is wrong.
# Inspired by bottkars/ansible_ppdm `2.0-playbook_test_credentials.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Test the PPDM login
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: List the credentials
      fjacquet.ppdm.credential_info:
      register: login_check

    - name: Report the login result
      ansible.builtin.debug:
        msg: Login succeeded, PPDM knows {{ login_check.credentials | length }} credentials.
