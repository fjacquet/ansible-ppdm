---
# List inventory sources (optionally filtered) and the Data Domain storage system (read-only).
# Inspired by bottkars/ansible_ppdm `99_get_inventory.yml and 99_get_data_domain.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: List inventory sources and storage systems
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the inventory sources
      fjacquet.ppdm.inventory_source_info:
        filter: "{{ inventory_filter or omit }}"
      register: ppdm_inventory

    - name: Show the inventory sources
      ansible.builtin.debug:
        msg: "{{ item.name }} {{ item.id }} {{ item.type }}"
      loop: "{{ ppdm_inventory.inventory_sources }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Get the Data Domain storage system
      fjacquet.ppdm.storage_system_info:
        name: "{{ ddve_hostname }}"
      register: ppdm_storage_systems

    - name: Show the storage system
      ansible.builtin.debug:
        var: ppdm_storage_systems.storage_systems
