---
# Read the appliance configuration (read-only).
# Inspired by bottkars/ansible_ppdm `1.1-playbook_get_ppdm_config.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Read the PPDM appliance configuration
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the appliance configurations
      fjacquet.ppdm.api:
        path: /api/v2/configurations
      register: ppdm_configurations

    - name: Show the configurations
      ansible.builtin.debug:
        var: ppdm_configurations.result
