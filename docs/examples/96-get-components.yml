---
# List the appliance components with their status (read-only).
# Inspired by bottkars/ansible_ppdm `99_playbook_get_components.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: List the PPDM components
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the components
      fjacquet.ppdm.api:
        path: /api/v2/components
      register: ppdm_components

    - name: Show the components
      ansible.builtin.debug:
        msg: "{{ item.componentDisplayName }} {{ item.componentType }} {{ item.status }}"
      loop: "{{ ppdm_components.result }}"
      loop_control:
        label: "{{ item.componentDisplayName }}"
