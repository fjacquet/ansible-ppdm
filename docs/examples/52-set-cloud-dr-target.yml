---
# Create the data target (storage account) of the Azure Cloud DR account.
# Inspired by bottkars/ansible_ppdm `2.4-playbook_set_cloud_dr_target.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: Set the Cloud DR data target
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the Cloud DR accounts
      fjacquet.ppdm.api:
        path: /api/v2/cloud-dr-accounts
      register: cdr_accounts

    - name: Check that the Azure account exists
      ansible.builtin.assert:
        that: cdr_accounts.result | selectattr('providerName', 'equalto', 'AZURE') | list | length == 1
        fail_msg: Expected exactly one AZURE Cloud DR account, run 51-configure-cloud-dr-account.yml first.

    - name: Get the data targets
      fjacquet.ppdm.api:
        path: "/api/v2/cloud-dr-accounts/{{ (cdr_accounts.result | selectattr('providerName', 'equalto', 'AZURE') | first).id }}/cloud-dr-data-targets"
      register: cdr_targets

    - name: Create the data target
      fjacquet.ppdm.api:
        method: POST
        path: "/api/v2/cloud-dr-accounts/{{ (cdr_accounts.result | selectattr('providerName', 'equalto', 'AZURE') | first).id }}/cloud-dr-data-targets"
        body:
          name: "{{ azure_storage_account }}"
          copiesStorageContainer:
            id: "{{ azure_storage_account }}"
      when: cdr_targets.result | selectattr('name', 'equalto', azure_storage_account) | list | length == 0
