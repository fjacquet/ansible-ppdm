---
# List the ACTIVE update package (set update_category to HISTORY for the history; read-only).
# Inspired by bottkars/ansible_ppdm `9.9-playbook_get_ppdm_update_package_active.yml and 9.9-playbook_get_ppdm_update_package_history.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional).
- name: List the PPDM update packages
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Get the update packages
      fjacquet.ppdm.api:
        path: /api/v2/upgrade-packages
        query:
          filter: category eq "{{ update_category | default('ACTIVE') }}"
      register: update_packages

    - name: Show the update packages
      ansible.builtin.debug:
        var: update_packages.result
