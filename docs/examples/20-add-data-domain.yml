---
# Trust the Data Domain certificate, create its credential and add it as an inventory source.
# Inspired by bottkars/ansible_ppdm `2.0-playbook_set_ddve.yml` (workflow only; rewritten for fjacquet.ppdm).
# Environment: PPDM_HOSTNAME, PPDM_USERNAME, PPDM_PASSWORD, PPDM_PORT (optional), DDVE_PASSWORD.
- name: Add a Data Domain to PPDM
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ lookup('ansible.builtin.env', 'PPDM_HOSTNAME') }}"
      username: "{{ lookup('ansible.builtin.env', 'PPDM_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'PPDM_PASSWORD') }}"
      port: "{{ lookup('ansible.builtin.env', 'PPDM_PORT') | default(8443, true) | int }}"
  tasks:
    - name: Trust the Data Domain certificate
      fjacquet.ppdm.certificate:
        host: "{{ ddve_hostname }}"
        port: "{{ ddve_port }}"
        fingerprint: "{{ ddve_fingerprint }}"

    - name: Ensure the Data Domain credential
      fjacquet.ppdm.credential:
        name: "{{ ddve_credential_name }}"
        type: DATADOMAIN
        cred_username: "{{ ddve_username }}"
        cred_password: "{{ lookup('ansible.builtin.env', 'DDVE_PASSWORD') }}"
      no_log: true
      register: ddve_credential

    - name: Ensure the Data Domain inventory source
      fjacquet.ppdm.inventory_source:
        name: "{{ ddve_hostname }}"
        type: DDSYSTEM
        address: "{{ ddve_hostname }}"
        source_port: "{{ ddve_port }}"
        credential_id: "{{ ddve_credential.credential.id }}"
